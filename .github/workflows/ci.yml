name: CI

# Every push to master and every pull request runs the suite on Linux, macOS and Windows, plus real Chromium, Firefox,
# and WebKit browser & Web Worker checks and 100% mutation testing: a schedule runs in a window and in Node on all three.
# A newer push to the same branch or pull request cancels the run before it.
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Nightly deep differential fuzzing of Optimal DPOR against unreduced exploration.
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'schedule' && 'schedule' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    if: github.event_name != 'schedule'
    name: suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The oldest TypeScript the package and its specs are held to
      - run: npm run typecheck:floor
      - run: npm run build
      - run: npm test
      - run: npm run workflows:check
      # Build determinism (byte-for-byte), emitted size ceilings, and steady-state exploration.
      - run: npm run package:check
      # The package as a consumer gets it: packed, installed elsewhere, typechecked on TS 5.7, and the README example run.
      - run: npm run package:smoke
      # The packed package as published code: its manifest and files (publint), and each entry's types (attw).
      - run: npm run package:lint

  # The schedule's specs in real browser engines and dedicated Web Workers: Chromium, Firefox, and WebKit via vitest's
  # browser mode and Playwright. Runs on macos-15 so all three engines install cleanly without Ubuntu's WebKit apt stack.
  browser:
    if: github.event_name != 'schedule'
    name: browser (chromium, firefox, webkit)
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-all-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install chromium firefox webkit
      - run: npm run test:browser

  # Every mutant of the source, run against the specs: one that survives fails.
  mutants:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run mutants

  # Differential oracle comparing wakeup-tree DPOR against unreduced exploration across randomized nested programs.
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run differential fuzzer
        env:
          FUZZ_PROGRAMS: ${{ github.event_name == 'schedule' && '2100' || '600' }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            export FUZZ_SEED="$(date -u +%Y%m%d)"
          fi
          npm run fuzz

  # Report nightly fuzz failures (and close on recovery) via a single issue on master.
  nightly-status:
    if: ${{ !cancelled() && github.event_name == 'schedule' && github.ref == 'refs/heads/master' }}
    needs: [fuzz]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - run: bash .github/scripts/master-status.sh ${{ needs.fuzz.result == 'success' && 'passed' || 'failed' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW: CI (nightly fuzz)
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}

  # The one check a release waits on: every job above passed.
  ci-pass:
    if: always() && github.event_name != 'schedule'
    needs: [suite, browser, mutants, fuzz]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: test "${{ needs.suite.result }}" = "success" -a "${{ needs.browser.result }}" = "success" -a "${{ needs.mutants.result }}" = "success" -a "${{ needs.fuzz.result }}" = "success"
